services:
  - type: web
    runtime: static
    name: engcalc-frontend
    branch: main
    buildCommand: npm ci --prefix frontend --no-audit --no-fund && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # No previews block: Render does not create PR previews by default.
